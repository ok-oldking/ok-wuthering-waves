[build-system]
requires = ["setuptools>=77", "cython>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "ok-ww"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "ok-script[ocr,qt] @ git+https://github.com/vb2250158/ok-script.git@659be8ba9b0c1f1fe3b7b1dfe2c76774c4d83b03",
    "onnxocr-ppocrv5>=0.0.20",
    "openvino",
    "opencv-python",
    "pyappify>=1.0.13"
]

[project.optional-dependencies]
dev = [
    "polib",
    "pytest",
]
docs = [
    "mkdocs-material>=9.5,<10",
]
web-test = [
    "ok-script[web] @ git+https://github.com/vb2250158/ok-script.git@659be8ba9b0c1f1fe3b7b1dfe2c76774c4d83b03",
]

[build-system]
requires = ["setuptools>=77", "cython>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "ok-ww"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "ok-script[ocr,qt]>=2.0.7b1",
    "onnxocr-ppocrv5>=0.0.20",
    "openvino",
    "opencv-python",
    "pyappify>=1.0.13"
]

[project.optional-dependencies]
macos-internal-build = [
    "Nuitka==4.1.1; sys_platform == 'darwin'",
    "cmake==3.31.6; sys_platform == 'darwin'",
    "openvino==2025.4.1; sys_platform == 'darwin'",
]
dev = [
    "polib",
    "pytest",
]
docs = [
    "mkdocs-material>=9.5,<10",
]
web-test = [
    "ok-script[web]==2.0.7b1",
]

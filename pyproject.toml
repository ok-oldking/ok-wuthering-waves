[build-system]
requires = ["setuptools>=77", "cython>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "ok-ww"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "dulwich==1.2.21",
    "mcp==2.3.0",
    "ok-script[ocr,qt]==3.0.5b4",
    "ok-pyside-minimal==6.12.0.post2",
    "onnxocr-ppocrv5>=0.0.23",
    "openvino",
    "opencv-python",
    "pyappify[standalone]>=1.0.19"
]

[project.optional-dependencies]
dev = [
    "polib",
    "pytest",
]
docs = [
    "mkdocs-material>=9.5,<10",
]
web-test = [
    "ok-script[web]==3.0.5b4",
]

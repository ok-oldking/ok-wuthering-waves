[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-score"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "ok-script[ocr,qt]>=2.0.7b1",
    "onnxocr-ppocrv5>=0.0.20",
    "openvino",
    "opencv-python",
    "pyappify>=1.0.13"
]

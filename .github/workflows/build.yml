name: Windows Installers

on:
  workflow_dispatch:
  push:
    tags: ["echo-score-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -p "Test*.py"
      - name: Build China and Global installers
        uses: ok-oldking/pyappify-action@master
      - name: Normalize artifact names
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem -Recurse -File -Filter '*setup.exe' | ForEach-Object {
            $profile = if ($_.Name -match 'global') { 'Global' } else { 'China' }
            Copy-Item $_.FullName "release/echo-score-win32-$profile-setup.exe"
          }
          if (-not (Get-ChildItem release -File -ErrorAction SilentlyContinue)) {
            throw 'PyAppify did not produce a setup executable.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: echo-score-windows-installers
          path: release/*.exe
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.exe

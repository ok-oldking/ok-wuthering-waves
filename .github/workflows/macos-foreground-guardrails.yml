name: macOS Foreground Branch Guardrails

on:
  push:
    branches:
      - feature/macos-foreground-mvp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-foreground-okww-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-game-contracts:
    name: No-game contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
        python-version:
          - "3.12"

    env:
      PYTHONIOENCODING: UTF-8
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}/ok-script

    steps:
      - name: Check out OK-WW integration branch
        uses: actions/checkout@v4
        with:
          path: ok-wuthering-waves
          submodules: recursive
          lfs: true
          persist-credentials: false

      - name: Check out exact compatible ok-script commit
        uses: actions/checkout@v4
        with:
          repository: Silhouette-my/ok-script
          ref: 29b495c3978db22eece6fe73d6339ba46cdd41c4
          path: ok-script
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ok-script/pyproject.toml
            ok-wuthering-waves/pyproject.toml
            ok-wuthering-waves/requirements.txt

      - name: Install Windows locked runtime and exact sibling
        if: runner.os == 'Windows'
        working-directory: ok-wuthering-waves
        shell: bash
        run: |
          set -euo pipefail
          framework_sha="$(git -C ../ok-script rev-parse HEAD)"
          export OK_SCRIPT_BUILD_VERSION="2.0.7b1+macos.${framework_sha}"
          echo "OK-WW $(git rev-parse HEAD) against ok-script ${framework_sha}"
          # Development-only exact-SHA matrix. requirements.txt is the repository's
          # existing Windows lock input; this workflow has contents:read and no secrets.
          python -m pip install -r requirements.txt  # NOSONAR
          python -m pip install "pytest==9.1.1" "pytest-subtests==0.15.0" "polib==1.2.0"
          python -m pip check

      - name: Install macOS sibling editable projects
        if: runner.os == 'macOS'
        working-directory: ok-wuthering-waves
        shell: bash
        run: |
          set -euo pipefail
          framework_sha="$(git -C ../ok-script rev-parse HEAD)"
          export OK_SCRIPT_BUILD_VERSION="2.0.7b1+macos.${framework_sha}"
          echo "OK-WW $(git rev-parse HEAD) against ok-script ${framework_sha}"
          python -m pip install "pip==26.2.1"
          # The editable framework is the exact commit checked out above. This branch-only
          # guardrail does not carry release credentials; release dependency locking is separate.
          python -m pip install -e "../ok-script[default,ocr,qt,dev]" "opencv-python==5.0.0.93" "pytest-subtests==0.15.0"  # NOSONAR
          python -m pip install "pytest==9.1.1" "polib==1.2.0"
          python -m pip check

      - name: Run platform and task capability contracts
        working-directory: ok-wuthering-waves
        shell: bash
        run: |
          python -m pytest -q tests/test_macos*.py

      - name: Run legacy task tests in isolated processes
        working-directory: ok-wuthering-waves
        shell: bash
        env:
          # Legacy tests construct QApplication; match the primary Windows gate.
          # Contracts above remain headless on both platforms.
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
        run: |
          set -euo pipefail
          for test_file in tests/Test*.py; do
            python -m unittest "$test_file"
          done

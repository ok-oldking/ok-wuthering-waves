name: Tests

on:
  push:
    branches: [slim]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run slim test suite
        run: python -m unittest discover -s tests -p "Test*.py"
      - name: Smoke-test application configuration
        run: python -c "import config; from src.task.EchoStatOverlayTask import EchoStatOverlayTask; assert len(config.config['trigger_tasks']) == 1"

# AI triage handles issue quality and missing information. This workflow only
# performs the separate, deterministic stale-issue cleanup.
name: Close inactive issues

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch: { }

permissions:
  issues: write

jobs:
  close-inactive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: Stale
          exempt-issue-labels: 'priority: high'
          stale-issue-message: '此 ISSUE 已 60 天没有活动，将在 14 天后自动关闭；补充信息或回复会保持其开启。 This issue has been inactive for 60 days and will close in 14 days unless updated.'
          close-issue-message: '由于长期没有新信息，此 ISSUE 已自动关闭；如果问题仍然存在，请补充当前版本、日志和复现步骤后重新打开。 Closed after prolonged inactivity; reopen with the current version, logs, and reproduction steps if the problem persists.'
          close-issue-reason: not_planned


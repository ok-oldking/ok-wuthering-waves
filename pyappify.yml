name: "echo-score"
uac: true
icon: "icons/icon.png"
website: "https://github.com/IceHe/ok-wuthering-waves"

profiles:
  - name: "China"
    git_url: "https://github.com/IceHe/ok-wuthering-waves.git"
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    use_pythonw: true
    pip_args: "--no-deps"
    show_add_defender: true
    # PYTHONPATH: "your/default/path" # Optional, will be "" if missing

  - name: "Global"
    git_url: "https://github.com/IceHe/ok-wuthering-waves.git"
    main_script: "main.py"
    requirements: "requirements.txt"

